server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
        # El HTML nombra los assets con hash: nunca debe servirse una copia vieja
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre: cachear fuerte
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
